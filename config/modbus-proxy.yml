# Diese Datei wird von der Plugin-GUI verwaltet (Konfiguration -> Speichern).
# Manuelle Aenderungen werden beim naechsten Speichern in der GUI ueberschrieben.
# Format: https://pypi.org/project/modbus-proxy/
devices:
- modbus:
    url: 192.168.1.10:502
    timeout: 10
    connection_time: 0
  listen:
    bind: 0:9010
logging:
  version: 1
  formatters:
    standard:
      format: "%(asctime)s %(levelname)8s %(name)s: %(message)s"
  handlers:
    console:
      class: logging.StreamHandler
      level: INFO
      formatter: standard
    info_file_handler:
      class: logging.handlers.RotatingFileHandler
      level: INFO
      formatter: standard
      filename: /opt/loxberry/log/plugins/modbus-proxy/modbus-proxy.log
      maxBytes: 204800
      backupCount: 1
      encoding: utf8
  root:
    handlers: ['console', 'info_file_handler']
    level: INFO
