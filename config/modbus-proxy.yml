# Diese Datei wird von der Plugin-GUI verwaltet (Konfiguration -> Speichern).
# Manuelle Änderungen werden beim nächsten Speichern in der GUI überschrieben.
# Format: https://pypi.org/project/modbus-proxy/
devices:
- modbus:
    url: 192.168.1.10:502
    timeout: 10
    connection_time: 0
  listen:
    bind: 0:9010
logging:
  version: 1
  formatters:
    standard:
      format: "%(asctime)s %(levelname)8s %(name)s: %(message)s"
  handlers:
    console:
      class: logging.StreamHandler
      level: INFO
      formatter: standard
  root:
    handlers: ['console']
    level: INFO
