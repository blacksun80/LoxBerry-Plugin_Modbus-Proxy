<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a6fb0"/>
      <stop offset="100%" stop-color="#1a4d80"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>

  <!-- Verbindungslinien: mehrere Clients links -> Proxy -> ein Geraet rechts -->
  <g stroke="#bfe0ff" stroke-width="10" stroke-linecap="round" fill="none">
    <line x1="118" y1="146" x2="222" y2="222"/>
    <line x1="118" y1="256" x2="222" y2="246"/>
    <line x1="118" y1="366" x2="222" y2="270"/>
    <line x1="290" y1="256" x2="380" y2="256"/>
  </g>

  <!-- Client-Knoten links -->
  <g fill="#eaf5ff">
    <circle cx="102" cy="146" r="26"/>
    <circle cx="102" cy="256" r="26"/>
    <circle cx="102" cy="366" r="26"/>
  </g>

  <!-- Proxy in der Mitte -->
  <rect x="222" y="206" width="100" height="100" rx="22" fill="#ffffff"/>
  <path d="M 250 256 h 12 l 10 -26 12 52 10 -26 12 0" stroke="#1a4d80" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Geraet rechts -->
  <g fill="#eaf5ff">
    <rect x="380" y="222" width="68" height="68" rx="14"/>
    <rect x="396" y="196" width="8" height="26" rx="3"/>
    <rect x="420" y="196" width="8" height="26" rx="3"/>
    <rect x="396" y="290" width="8" height="26" rx="3"/>
    <rect x="420" y="290" width="8" height="26" rx="3"/>
  </g>
</svg>
