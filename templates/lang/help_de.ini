[HELP]
INTRO=Dieses Plugin steuert den Python-Dienst <b>modbus-proxy</b>. Er nimmt Modbus-TCP-Verbindungen von mehreren Clients (z.B. Loxone-Miniserver, Visualisierungen) entgegen und reicht sie seriell an ein einzelnes Modbus-TCP-Gerät weiter, das selbst nur wenige gleichzeitige Verbindungen erlaubt.
FIELDS_HEAD=Felder je Gerät
FIELD_MODBUS_URL=<b>Ziel-Adresse:</b> IP-Adresse (oder Hostname) und Port des echten Modbus-TCP-Geräts (z.B. einer SPS oder eines Wärmepumpen-Reglers), z.B. 192.168.1.10 und Port 502. Der Standard-Port für Modbus-TCP ist 502.
FIELD_TIMEOUT=<b>Timeout:</b> wie lange auf eine Antwort des echten Geräts gewartet wird, bevor die Verbindung als gestört gilt.
FIELD_CONNECTION_TIME=<b>Verbindungsverzögerung:</b> Wartezeit nach dem Verbindungsaufbau zum echten Gerät, bevor die erste Anfrage gesendet wird. Manche Geräte brauchen das kurz nach dem Verbindungsaufbau.
FIELD_LISTEN_BIND=<b>Port für die Clients:</b> unter dieser Portnummer stellt der Proxy das Gerät bereit. Die Clients (z.B. Loxone) verbinden sich mit der IP-Adresse des LoxBerry und diesem Port. Der Proxy lauscht dabei immer auf allen Netzwerkschnittstellen. Jedes Gerät braucht eine eigene Portnummer - allein über den Port entscheidet ein Client, mit welchem Gerät er spricht. Ist die Nummer bereits von einem anderen Dienst belegt, startet der Proxy nicht; der Grund steht dann im Reiter "Log" unter "Startprotokoll".
FIELD_UNIT_ID=<b>Unit-ID-Umleitung:</b> optional. Damit kann eine vom Client angefragte Modbus-Unit-ID (auch "Slave-ID" genannt) auf eine andere Unit-ID am echten Gerät umgeleitet werden.
EXPORT_HEAD=Sicherung
EXPORT_TEXT=Die aktuelle Konfiguration kann als YAML-Datei heruntergeladen und später wieder eingespielt werden - z.B. als Backup oder um die Einstellungen auf einen anderen LoxBerry zu übertragen.
