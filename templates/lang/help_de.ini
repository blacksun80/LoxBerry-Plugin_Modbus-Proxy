[HELP]
INTRO=Dieses Plugin steuert den Python-Dienst <b>modbus-proxy</b>. Er nimmt Modbus-TCP-Verbindungen von mehreren Clients (z.B. Loxone-Miniserver, Visualisierungen) entgegen und reicht sie serialisiert an ein einzelnes Modbus-TCP-Geraet weiter, das selbst nur wenige gleichzeitige Verbindungen erlaubt.
FIELDS_HEAD=Felder je Geraet
FIELD_MODBUS_URL=<b>Ziel-Adresse:</b> Host und Port des echten Modbus-TCP-Geraets (z.B. einer SPS oder eines Waermepumpen-Reglers), z.B. 192.168.1.10:502.
FIELD_TIMEOUT=<b>Timeout:</b> wie lange auf eine Antwort des Geraets gewartet wird, bevor die Verbindung als gestoert gilt.
FIELD_CONNECTION_TIME=<b>Verbindungsverzoegerung:</b> Wartezeit nach dem Verbindungsaufbau, bevor die erste Anfrage gesendet wird. Manche Geraete brauchen das.
FIELD_LISTEN_BIND=<b>Listen-Adresse:</b> Adresse und Port, auf denen der Proxy selbst lauscht. Clients (z.B. Loxone) verbinden sich hierher statt direkt zum Geraet. "0" als Host bedeutet: auf allen Netzwerkschnittstellen des LoxBerry.
FIELD_UNIT_ID=<b>Unit-ID-Umleitung:</b> optional. Damit kann eine vom Client angefragte Modbus-Unit-ID auf eine andere Unit-ID am echten Geraet umgeleitet werden.
EXPORT_HEAD=Sicherung
EXPORT_TEXT=Die aktuelle Konfiguration kann als YAML-Datei heruntergeladen und spaeter wieder eingespielt werden - z.B. als Backup oder um die Einstellungen auf einen anderen LoxBerry zu uebertragen.
LINK_INFO=Weitere Informationen zum zugrunde liegenden Dienst:
LINK=https://pypi.org/project/modbus-proxy/
LINK_TEXT=modbus-proxy auf PyPI
