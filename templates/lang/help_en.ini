[HELP]
INTRO=This plugin controls the Python service <b>modbus-proxy</b>. It accepts Modbus TCP connections from multiple clients (e.g. a Loxone Miniserver, visualizations) and forwards them, serialized, to a single Modbus TCP device that itself only allows a few simultaneous connections.
FIELDS_HEAD=Fields per device
FIELD_MODBUS_URL=<b>Target address:</b> host and port of the real Modbus TCP device (e.g. a PLC or heat pump controller), e.g. 192.168.1.10:502.
FIELD_TIMEOUT=<b>Timeout:</b> how long to wait for a response from the device before the connection is considered faulty.
FIELD_CONNECTION_TIME=<b>Connection delay:</b> delay after establishing the connection before the first request is sent. Some devices require this.
FIELD_LISTEN_BIND=<b>Listen address:</b> address and port the proxy itself listens on. Clients (e.g. Loxone) connect here instead of directly to the device. Host "0" means: on all network interfaces of the LoxBerry.
FIELD_UNIT_ID=<b>Unit ID remapping:</b> optional. Lets you remap a Modbus unit ID requested by a client to a different unit ID on the real device.
EXPORT_HEAD=Backup
EXPORT_TEXT=The current configuration can be downloaded as a YAML file and re-imported later - e.g. as a backup, or to transfer the settings to another LoxBerry.
LINK_INFO=More information about the underlying service:
LINK=https://pypi.org/project/modbus-proxy/
LINK_TEXT=modbus-proxy on PyPI
