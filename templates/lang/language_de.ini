[CONFIG]
HEAD=Konfiguration
DEVICE=Modbus-Gerät
MODBUS_URL=Ziel-Adresse (Host:Port)
MODBUS_URL_HINT=Adresse des echten Modbus-TCP-Geräts (z.B. SPS, Wärmepumpe, Wechselrichter), z.B. 192.168.1.10:502. Der Standard-Port für Modbus-TCP ist 502.
TIMEOUT=Timeout (s)
TIMEOUT_HINT=Wie lange (in Sekunden) auf eine Antwort des echten Modbus-Geräts (siehe Ziel-Adresse oben) gewartet wird, bevor die Verbindung als gestört gilt. Bezieht sich NICHT auf die Verbindung der Clients zum Proxy.
CONNECTION_TIME=Verbindungsverzögerung (s)
CONNECTION_TIME_HINT=Wartezeit (in Sekunden) nach dem Verbindungsaufbau zum echten Gerät, bevor die erste Anfrage gesendet wird. Manche Geräte brauchen nach dem Verbindungsaufbau kurz Zeit, bevor sie antwortbereit sind. Im Regelfall auf 0 lassen, nur bei Verbindungsfehlern direkt nach dem Verbindungsaufbau erhöhen.
LISTEN_BIND=Listen-Adresse (Host:Port)
LISTEN_BIND_HINT=Adresse, unter der der Proxy selbst für die Clients (z.B. Loxone Miniserver) erreichbar ist - NICHT die Adresse des Modbus-Geräts. "0" als Host bedeutet: der Proxy lauscht auf allen Netzwerkschnittstellen dieses LoxBerry, die Clients verbinden sich also mit der IP-Adresse des LoxBerry. Die Zahl dahinter (z.B. 9010) ist der Port, den die Clients in ihrer eigenen Modbus-Konfiguration eintragen müssen. Jedes Gerät braucht eine eigene, noch nicht belegte Portnummer.
UNIT_ID_REMAPPING=Unit-ID-Umleitung (optional)
UNIT_ID_REMAPPING_HINT=Nur nötig, wenn die Modbus-Unit-ID (auch "Slave-ID" genannt), die ein Client anfragt, nicht mit der Unit-ID übereinstimmt, unter der das echte Gerät erreichbar ist. Format: Client-ID:Geräte-ID, mehrere durch Komma getrennt, z.B. "1:0" leitet eine vom Client an Unit-ID 1 gesendete Anfrage an Unit-ID 0 am echten Gerät weiter. Im Regelfall leer lassen.
ADD_DEVICE=Gerät hinzufügen
REMOVE_DEVICE=Entfernen
REMOVE_DEVICE_CONFIRM=Soll dieses Gerät wirklich aus der Konfiguration entfernt werden?
CANCEL=Abbrechen
LOG_LEVEL=Log-Level
SAVE=Speichern
SAVED_OK=Konfiguration gespeichert und Dienst neu gestartet.
SAVE_ERROR=Fehler beim Speichern der Konfiguration.
VALIDATION_ERROR=Bitte für jedes Gerät Ziel-Adresse und Listen-Adresse angeben.
NO_DEVICES=Mindestens ein Gerät wird benötigt.

[LOG]
LEVEL_HEAD=Protokollierung
LEVEL_HINT=Legt fest, wie ausführlich der Dienst protokolliert. DEBUG protokolliert jede einzelne Anfrage und ist nur zur Fehlersuche sinnvoll, im Normalbetrieb ist INFO empfohlen. Eine Änderung startet den Dienst neu.
SAVED_OK=Log-Level gespeichert und Dienst neu gestartet.
HEAD=Logdatei
OPEN_FULL=Vollständiges Log öffnen
TAIL_INFO=Zeigt die letzten 120 Zeilen
REFRESH=Aktualisieren
NO_LOGFILE=Es existiert noch keine Logdatei. Sie wird angelegt, sobald der Dienst zum ersten Mal gestartet wurde.
EMPTY=Die Logdatei ist derzeit leer.

[EXPORT]
HEAD=Sicherung
EXPORT_HEAD=Konfiguration sichern
EXPORT_HINT=Lädt die aktuelle Konfiguration als YAML-Datei herunter - als Sicherung oder um die Einstellungen auf einen anderen LoxBerry zu übertragen.
CURRENT_DEVICES=Aktuell konfigurierte Geräte
EXPORT_BTN=Konfiguration exportieren
IMPORT_HEAD=Konfiguration wiederherstellen
IMPORT_HINT=Spielt eine zuvor exportierte YAML-Datei wieder ein. Die bisherige Konfiguration wird dabei überschrieben (eine Kopie wird als modbus-proxy.yml.bak abgelegt) und der Dienst neu gestartet.
IMPORT_LABEL=Konfigurationsdatei importieren (.yml)
IMPORT_BTN=Importieren
IMPORT_OK=Konfiguration importiert und Dienst neu gestartet.
IMPORT_ERROR=Ungültige Konfigurationsdatei - es wurde kein gültiges Gerät gefunden.
IMPORT_NOFILE=Bitte zuerst eine Datei auswählen.
