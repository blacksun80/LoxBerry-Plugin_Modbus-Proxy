[CONFIG]
HEAD=Configuration
DEVICE=Modbus device
MODBUS_URL=Target address of the Modbus device
MODBUS_URL_HINT=Address of the real Modbus TCP device (e.g. PLC, heat pump, inverter) the proxy forwards the requests to.
MODBUS_HOST_SUB=IP address or hostname
MODBUS_PORT_SUB=Port (default 502)
HOST_PLACEHOLDER=e.g. 192.168.1.10
UNIT_ID_PLACEHOLDER=e.g. 1:0
HOST_INVALID=Please enter a complete IP address (four numbers from 0 to 255, e.g. 192.168.1.10) or a hostname (e.g. heatpump.fritz.box) - without a port, without http:// and without spaces.
PORT_INVALID=Please enter a port number between 1 and 65535.
TIMEOUT_INVALID=Please enter a value between 0 and 3600 seconds.
CONNECTION_TIME_INVALID=Please enter a value between 0 and 600 seconds.
UNIT_ID_INVALID=Format: client ID:device ID, separate multiple with commas, e.g. "1:0" or "1:0, 2:5". Allowed are numbers from 0 to 255. Leave empty if not needed.
TIMEOUT=Timeout (s)
TIMEOUT_HINT=How long (in seconds) to wait for a response from the real Modbus device (see target address above) before the connection is considered faulty. Does NOT refer to the connection between the clients and the proxy.
CONNECTION_TIME=Connection delay (s)
CONNECTION_TIME_HINT=Delay (in seconds) after establishing the connection to the real device before the first request is sent. Some devices need a short moment after connecting before they are ready to respond. Leave at 0 normally, only increase it if you see connection errors right after connecting.
LISTEN_PORT=Port for the clients
LISTEN_PORT_HINT=The proxy offers this device on this port number. The clients (e.g. a Loxone Miniserver) connect to this LoxBerry's IP address and this port instead of connecting to the device directly. Every device needs its own port number, because the port alone decides which device a client talks to (so with several devices use e.g. 9010, 9011, 9012). The number must not already be used by another service on this LoxBerry - otherwise the proxy cannot start.
UNIT_ID_REMAPPING=Unit ID remapping (optional)
UNIT_ID_REMAPPING_HINT=Only needed if the Modbus unit ID (also called "slave ID") a client requests does not match the unit ID the real device is reachable under. Format: client ID:device ID, separate multiple with commas, e.g. "1:0" forwards a request sent by the client to unit ID 1 to unit ID 0 on the real device. Leave empty normally.
ADD_DEVICE=Add device
REMOVE_DEVICE=Remove
REMOVE_DEVICE_CONFIRM=Do you really want to remove this device from the configuration?
CANCEL=Cancel
LOG_LEVEL=Log level
SAVE=Save
SAVED_OK=Configuration saved and service restarted.
SAVED_BUT_FAILED=Configuration saved, but the service could not be started.
SAVE_ERROR=Error saving the configuration.
VALIDATION_ERROR=Please provide a valid target address and a valid client port for every device.
PORT_CONFLICT=Every port number may only be used once - two devices cannot share the same port for the clients.
NO_DEVICES=At least one device is required.

[LOG]
LEVEL_HEAD=Logging
LEVEL_HINT=Defines how verbosely the service logs. DEBUG logs every single request and is only useful for troubleshooting; INFO is recommended for normal operation. The selection is applied immediately and restarts the service automatically.
SAVED_OK=Log level saved and service restarted.
HEAD=Log file
OPEN_FULL=Open full log
HINT=Contains everything: the service's own messages, the start/stop procedures and the reason if the service fails to start (e.g. because a port number is already in use). The file is truncated automatically once it exceeds 1 MB, so it cannot fill up the disk.
TAIL_INFO=Showing the last 150 lines
REFRESH=Refresh
AUTO_REFRESH=Refreshes automatically every 5 seconds.
NO_LOGFILE=There is no log file yet. It is created as soon as the service has been started for the first time.
EMPTY=The log file is currently empty.

[EXPORT]
HEAD=Backup
EXPORT_HEAD=Back up configuration
EXPORT_HINT=Downloads the current configuration as a YAML file - as a backup, or to transfer the settings to another LoxBerry.
CURRENT_DEVICES=Currently configured devices
EXPORT_BTN=Export configuration
IMPORT_HEAD=Restore configuration
IMPORT_HINT=Restores a previously exported YAML file. The existing configuration is overwritten (a copy is kept as modbus-proxy.yml.bak) and the service is restarted.
IMPORT_LABEL=Import configuration file (.yml)
IMPORT_BTN=Import
IMPORT_OK=Configuration imported and service restarted.
IMPORT_ERROR=Invalid configuration file - no valid device was found.
IMPORT_HOST_RESET=Note: in the file at least one device was restricted to a single network interface. This plugin always listens on all interfaces - the restriction has been removed.
IMPORT_NOFILE=Please select a file first.
